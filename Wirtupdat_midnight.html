<style>

</style></head><body>
<header class="top"><div><small>Offline maritime records workspace</small><h1>Voyages & account books</h1></div><label class="upload">Upload CSVs<input id="files" type="file" accept=".csv,text/csv" multiple hidden></label></header><div id="status" class="status"></div>
<div class="bar"><div><select id="source"></select><button id="remove" class="remove">Remove source</button></div><input id="search" placeholder="Search this source"></div>
<main class="workspace"><section class="panel main"><div class="heading"><div><h2 id="title">Upload a CSV to begin</h2><p id="subtitle">Coordinates will be mapped automatically.</p></div><div class="tabs"><button id="maptab" class="active">Voyage map</button><button id="caltab">Calendar</button></div></div><div id="legend" class="legend"><span><i class="dot"></i> At sea</span><span><i class="star">★</i> Explicit port record</span></div><div id="view" class="view empty"><h2>No source loaded</h2><p>Choose one or more logbook or account-book CSV files.</p></div><div id="strip" class="strip"></div></section><aside id="details" class="panel details"><div class="empty"><p>Select a record.</p></div></aside></main>
<script>
const KEY='maritime-records-v3',E=id=>document.getElementById(id),status=E('status'),source=E('source'),title=E('title'),subtitle=E('subtitle'),maptab=E('maptab'),caltab=E('caltab'),legend=E('legend'),view=E('view'),strip=E('strip'),details=E('details'),files=E('files'),search=E('search'),remove=E('remove');let sets=[],active='',selected=0,query='',mode='map',mapState={lon:-35,lat:22,z:2},box={};

const split=v=>v.split(';').map(x=>x.trim()).filter(Boolean),num=v=>v.trim()&&isFinite(Number(v))?Number(v):undefined,esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const current=()=>sets.find(x=>x.id===active)||sets[0],shown=()=>{let d=current();return d?d.records.filter(r=>!query||(r.date+' '+r.entry+' '+r.note+' '+r.ships+' '+r.nature).toLowerCase().includes(query.toLowerCase())):[]},save=()=>localStorage.setItem(KEY,JSON.stringify(sets));function say(x){E('status').textContent=x;E('status').style.display='block'}
function distance(a,b){let R=3440.065,z=Math.PI/180,dlat=(b.lat-a.lat)*z,dlon=(b.lon-a.lon)*z,q=Math.sin(dlat/2)**2+Math.cos(a.lat*z)*Math.cos(b.lat*z)*Math.sin(dlon/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function render(){let d=current(),rs=shown(),source=E('source'),view=E('view'),strip=E('strip');source.innerHTML=sets.map(x=>'<option value="'+esc(x.id)+'"'+(x.id===active?' selected':'')+'>'+esc(x.name)+'</option>').join('');E('title').textContent=d?d.name:'Upload a CSV to begin';E('subtitle').textContent=d?d.file+' · '+d.kind:'Coordinates will be mapped automatically.';E('maptab').classList.toggle('active',mode==='map');E('caltab').classList.toggle('active',mode==='calendar');E('legend').style.display=mode==='map'?'flex':'none';if(!d){view.className='view empty';view.innerHTML='<h2>No source loaded</h2><p>Choose one or more CSV files.</p>';strip.innerHTML='';return}selected=Math.min(selected,Math.max(0,rs.length-1));let rec=rs[selected];mode==='map'?drawMap(rs.filter(r=>r.lat!==undefined&&r.lon!==undefined),rec):drawCal(d.records,rec);strip.innerHTML=rs.map((r,i)=>'<button data-i="'+i+'" class="'+(i===selected?'active':'')+'"><b>'+r.day+'</b><span>'+esc(r.short)+'</span></button>').join('');strip.querySelectorAll('button').forEach(b=>b.onclick=()=>{selected=+b.dataset.i;render()});detail(rec,rs)}
function worldXY(lon,lat,z){let s=256*2**z,x=(lon+180)/360*s,cl=Math.max(-85.0511,Math.min(85.0511,lat)),y=(1-Math.log(Math.tan(cl*Math.PI/180)+1/Math.cos(cl*Math.PI/180))/Math.PI)/2*s;return{x,y,s}}
function drawMap(ps,rec){let view=E('view');if(!ps.length){view.className='view empty';view.innerHTML='<h2>No coordinates in this source</h2><p>The calendar still includes every dated record.</p>';return}view.className='view';view.innerHTML='<div id="tilemap" class="map"><div id="tiles" class="tiles"></div><svg id="overlay" class="overlay"></svg><span class="help">Scroll to zoom · drag to pan</span><span class="attrib">© <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a></span></div>';requestAnimationFrame(()=>paintMap(ps,rec));}
function paintMap(ps,rec){let map=E('tilemap'),tiles=E('tiles'),svg=E('overlay');if(!map)return;let W=map.clientWidth,H=map.clientHeight,z=mapState.z,c=worldXY(mapState.lon,mapState.lat,z),left=c.x-W/2,top=c.y-H/2,minX=Math.floor(left/256),maxX=Math.floor((left+W)/256),minY=Math.floor(top/256),maxY=Math.floor((top+H)/256),n=2**z,t='';for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){if(y<0||y>=n)continue;let xx=((x%n)+n)%n;t+='<img class="tile" draggable="false" src="https://tile.openstreetmap.org/'+z+'/'+xx+'/'+y+'.png" style="left:'+(x*256-left)+'px;top:'+(y*256-top)+'px">'}tiles.innerHTML=t;let screen=r=>{let p=worldXY(r.lon,r.lat,z);while(p.x-c.x>p.s/2)p.x-=p.s;while(p.x-c.x<-p.s/2)p.x+=p.s;return{x:p.x-left,y:p.y-top}},line=ps.map(r=>{let p=screen(r);return p.x+','+p.y}).join(' '),marks=ps.map(r=>{let p=screen(r),on=r.id===rec?.id,shape=r.place==='port'?'<polygon points="0,-12 3,-4 11,-3 5,2 7,11 0,6 -7,11 -5,2 -11,-3 -3,-4" transform="translate('+p.x+' '+p.y+')"/>':'<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(on?9:7)+'"/>';return'<g class="point '+(on?'selected':'')+'" data-id="'+r.id+'">'+shape+'<text x="'+p.x+'" y="'+(p.y+3)+'">'+r.day+'</text></g>'}).join('');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.innerHTML='<polyline class="under" points="'+line+'"/><polyline class="route" points="'+line+'"/>'+marks;svg.querySelectorAll('.point').forEach(g=>g.onclick=e=>{e.stopPropagation();selected=shown().findIndex(r=>r.id===g.dataset.id);render()});if(!map.dataset.controls){map.dataset.controls='1';mapControls(map,ps,rec)}}
function mapControls(map,ps,rec){let drag=false,start,base,wheel=0;map.onwheel=e=>{e.preventDefault();wheel+=e.deltaY;if(Math.abs(wheel)<180)return;mapState.z=Math.max(1,Math.min(8,mapState.z+(wheel<0?1:-1)));wheel=0;paintMap(ps,rec)};map.onpointerdown=e=>{if(e.button!==0||e.target.closest('.point'))return;drag=true;start={x:e.clientX,y:e.clientY};base={...mapState};map.setPointerCapture(e.pointerId);map.classList.add('dragging')};map.onpointermove=e=>{if(!drag)return;let c=worldXY(base.lon,base.lat,base.z),p={x:c.x-(e.clientX-start.x),y:c.y-(e.clientY-start.y),s:c.s};mapState.lon=p.x/p.s*360-180;let a=Math.PI*(1-2*p.y/p.s);mapState.lat=180/Math.PI*Math.atan(Math.sinh(a));paintMap(ps,rec)};map.onpointerup=map.onpointercancel=()=>{drag=false;map.classList.remove('dragging')}}
function drawCal(rs,rec){let dated=rs.filter(r=>r.dateObj).sort((a,b)=>a.dateObj-b.dateObj);if(!dated.length){view.className='view empty';view.innerHTML='<h2>No machine-readable dates</h2><p>Use dates such as October 15, 1850.</p>';return}view.className='view calendar';let by=new Map(dated.map(r=>[r.dateObj.toISOString().slice(0,10),r])),first=new Date(dated[0].dateObj.getFullYear(),dated[0].dateObj.getMonth(),1),last=new Date(dated.at(-1).dateObj.getFullYear(),dated.at(-1).dateObj.getMonth()+1,0),html='';for(let m=new Date(first);m<=last;m.setMonth(m.getMonth()+1)){let y=m.getFullYear(),mo=m.getMonth(),cells='';for(let i=0;i<new Date(y,mo,1).getDay();i++)cells+='<button class="day blank"></button>';for(let n=1;n<=new Date(y,mo+1,0).getDate();n++){let d=new Date(y,mo,n,12),r=by.get(d.toISOString().slice(0,10)),sum=r?(r.nature[0]||r.ships[0]||r.note||r.entry).slice(0,60):'No entry loaded';cells+='<button '+(r?'data-id="'+r.id+'"':'disabled')+' class="day '+(r?'':'missing')+' '+(r?.id===rec?.id?'active':'')+'"><b>'+n+'</b><span>'+esc(sum)+'</span></button>'}html+='<section class="month"><h3>'+new Intl.DateTimeFormat('en',{month:'long',year:'numeric'}).format(m)+'</h3><div class="week">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>'<span>'+x+'</span>').join('')+'</div><div class="days">'+cells+'</div></section>'}view.innerHTML=html;view.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{let i=shown().findIndex(r=>r.id===b.dataset.id);if(i>=0){selected=i;render()}})}

files.onchange=async e=>{let add=[];for(let f of e.target.files)try{add.push(make(await f.text(),f.name))}catch(x){say(x.message)}if(add.length){sets.push(...add);active=add[0].id;selected=0;save();say('Added '+add.map(x=>x.name).join(', '));render()}e.target.value=''};source.onchange=e=>{active=e.target.value;selected=0;box={x:0,y:0,w:1000,h:500};render()};search.oninput=e=>{query=e.target.value;selected=0;render()};remove.onclick=()=>{sets=sets.filter(x=>x.id!==active);active=sets[0]?.id||'';save();render()};maptab.onclick=()=>{mode='map';render()};caltab.onclick=()=>{mode='calendar';render()};try{sets=JSON.parse(localStorage.getItem(KEY)||'[]');active=sets[0]?.id||'';sets.forEach(d=>d.records.forEach(r=>r.dateObj=pdate(r.date)))}catch{}render();
</script></body></html>
