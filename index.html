<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>William Wirt Voyage Archive</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <header class="top-bar">
      <div>
        <small>William Wirt voyage archive</small>
        <h1>Voyages &amp; account books</h1>
      </div>

      <!-- The published CSV loads automatically. This remains useful for testing. -->
      <label class="upload-button">
        Upload another CSV
        <input id="files" type="file" accept=".csv,text/csv" multiple hidden />
      </label>
    </header>

    <div id="status" class="status" role="status"></div>

    <div class="toolbar">
      <div>
        <label class="screen-reader-only" for="source">Source</label>
        <select id="source"></select>
        <button id="remove" class="text-button" type="button">Remove source</button>
      </div>

      <label class="screen-reader-only" for="search">Search this source</label>
      <input id="search" type="search" placeholder="Search this source" />
    </div>

    <main class="workspace">
      <section class="panel main-panel">
        <div class="heading">
          <div>
            <h2 id="title">Loading the voyage…</h2>
            <p id="subtitle">The published CSV will load automatically.</p>
          </div>

          <div class="tabs" aria-label="Primary view">
            <button id="map-tab" class="active" type="button">Voyage map</button>
            <button id="calendar-tab" type="button">Calendar</button>
          </div>
        </div>

        <div id="legend" class="legend">
          <span><i class="legend-dot recorded"></i> Recorded position</span>
          <span><i class="legend-dot estimated"></i> Estimated position</span>
          <span><i class="legend-star">★</i> Port visit</span>
        </div>

        <div id="view" class="view empty-state">
          <div>
            <h2>Loading voyage data</h2>
            <p>Please wait a moment.</p>
          </div>
        </div>

        <div id="record-strip" class="record-strip"></div>
      </section>

      <aside id="details" class="panel details-panel">
        <div class="empty-state">
          <p>Select a record.</p>
        </div>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
